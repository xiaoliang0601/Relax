name: Build SFT CUDA 12 image

on:
  push:
    branches:
      - codex/build-sft-cu12-0d65aba3

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository == 'xiaoliang0601/Relax'
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: 0d65aba3c54238f119e19b5aa8de65e8fdc99f36
      BASE_IMAGE: docker.io/lmsysorg/sglang:v0.5.17-cu129
      IMAGE: ghcr.io/xiaoliang0601/relax-sft-cu12:dev-0d65aba3-cu12
    steps:
      - name: Check out the PR source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Prepare the hosted runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
          docker buildx create --name relax-cu12 --driver docker-container --use
          docker buildx imagetools inspect "$BASE_IMAGE"

      - name: Build and publish the CUDA 12 dev image
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # Limit compilation concurrency on the hosted runner.
          sed -E \
            -e 's/MAX_JOBS=(16|64|96)/MAX_JOBS=2/g' \
            -e 's/--threads 32/--threads 2/g' \
            -e 's/--parallel 8/--parallel 2/g' \
            docker/Dockerfile > "$RUNNER_TEMP/Dockerfile.cu12"
          docker buildx build \
            --platform linux/amd64 \
            --progress plain \
            --file "$RUNNER_TEMP/Dockerfile.cu12" \
            --target relax \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg ROUTER_BUILD_JOBS=2 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --metadata-file "$RUNNER_TEMP/image.json" \
            --tag "$IMAGE" \
            --push .
          digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/image.json")"
          printf 'Source %s\nImage %s@%s\n' "$SOURCE_SHA" "$IMAGE" "$digest" | tee -a "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$IMAGE@$digest"
