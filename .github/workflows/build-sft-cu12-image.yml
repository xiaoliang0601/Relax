name: Build SFT CUDA 12 image

on:
  push:
    branches:
      - codex/build-sft-cu12-0d65aba3

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository == 'xiaoliang0601/Relax'
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: 0d65aba3c54238f119e19b5aa8de65e8fdc99f36
      SOURCE_TAG: sft-ce-cu12-0d65aba3
      BASE_IMAGE: ghcr.io/redai-studio/relaxrl:sglang-v0.5.21-cu129@sha256:24fe058f0b5aa87aead7cf35b58d6a3cae6b8fc238ba870015d6a8037c1b6402
      IMAGE: ghcr.io/xiaoliang0601/relax-sft-cu12:dev-0d65aba3-sglang0521-cu12
    steps:
      - name: Check out the build recipe
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out the tagged Relax source
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.SOURCE_TAG }}
          path: source
          persist-credentials: false

      - name: Prepare the hosted runner
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
          free -h
          docker buildx create --name relax-cu12 --driver docker-container --use
          docker buildx imagetools inspect "$BASE_IMAGE"

      - name: Prepare the tagged source for offline checkout
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          git branch relax-runtime "$SOURCE_SHA"
          git clone --no-local --depth 1 --single-branch --branch relax-runtime --bare . "$RUNNER_TEMP/relax-source.git"

      - name: Select the Hopper CUDA 12 build recipe
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          git apply --check ../.github/docker/sft-cu12-sglang0521.patch
          git apply ../.github/docker/sft-cu12-sglang0521.patch

      - name: Build and publish the CUDA 12 dev image
        shell: bash
        working-directory: source
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # Limit compilation concurrency on the hosted runner.
          sed -E \
            -e 's/MAX_JOBS=(16|64|96)/MAX_JOBS=1/g' \
            -e 's/--threads 32/--threads 1/g' \
            -e 's/--parallel 8/--parallel 1/g' \
            docker/Dockerfile > "$RUNNER_TEMP/Dockerfile.cu12"
          cat >> "$RUNNER_TEMP/Dockerfile.cu12" <<'DOCKERFILE'

          COPY --from=relax-source / /opt/relax-source.git/
          ARG RELAX_SOURCE_SHA
          RUN git clone --no-local --depth 1 --single-branch --branch relax-runtime /opt/relax-source.git /tmp/relax-source \
              && cp -a /tmp/relax-source/. /opt/relax/ \
              && git -C /opt/relax fetch \
              && git -C /opt/relax checkout --detach "${RELAX_SOURCE_SHA}" \
              && test "$(git -C /opt/relax rev-parse HEAD)" = "${RELAX_SOURCE_SHA}" \
              && rm -r /tmp/relax-source
          DOCKERFILE
          docker buildx build \
            --platform linux/amd64 \
            --progress plain \
            --file "$RUNNER_TEMP/Dockerfile.cu12" \
            --target relax \
            --build-context "relax-source=$RUNNER_TEMP/relax-source.git" \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg RELAX_SOURCE_SHA="$SOURCE_SHA" \
            --build-arg ROUTER_BUILD_JOBS=1 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --metadata-file "$RUNNER_TEMP/image.json" \
            --tag "$IMAGE" \
            --push .
          digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/image.json")"
          printf 'Source %s\nBuild recipe %s\nImage %s@%s\n' "$SOURCE_SHA" "$GITHUB_SHA" "$IMAGE" "$digest" | tee -a "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$IMAGE@$digest"
